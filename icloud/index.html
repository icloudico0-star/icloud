<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iXtool 使用图文教程</title>
    <style>
        /* 基础重置 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* 浅灰背景，突出图片内容 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        /* 容器样式：限制最大宽度，防止在电脑大屏幕上图片拉伸过长 */
        .content-container {
            width: 100%;
            max-width: 600px; /* 适配手机和窄屏电脑阅读 */
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            padding: 20px 0;
            min-height: 100vh;
        }

        /* 头部标题 */
        .header {
            text-align: center;
            padding: 0 20px 20px;
        }
        .header h1 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        /* 图片展示区 */
        .image-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 底部说明 */
        .footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="content-container">
        <div class="header">
            <h1>MIX 快捷指令 iCloud OFF 使用教程</h1>
        </div>

        <div class="image-wrapper">
            <!-- 
                使用说明：
                1. 将你的长图命名为 tutorial.png 放在同级目录下。
                2. 如果你的图片格式是 jpg，请将 src 改为 tutorial.jpg。
            -->
            <img src="tutorial.png" alt="iXtool 完整操作流程截图" loading="eager">
        </div>

        <div class="footer">
            <p>© 图文使用教程指引</p>
        </div>
    </div>

</body>
</html>
